# path: api-gateway/src/main/resources/application.yml
# purpose: cau hinh cong va bang dinh tuyen cho api-gateway - diem vao duy nhat cua he thong
spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}

            - id: course-service-list
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses

            - id: course-service-detail
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/${segment}

            - id: registration-service-list
              uri: ${REGISTRATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations

            - id: registration-service-detail
              uri: ${REGISTRATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/${segment}

            - id: course-service-partner
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/public/courses
              filters:
                - RewritePath=/api/public/courses, /courses

            - id: auth-service-apikeys
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/api-keys,/api/api-keys/**
              filters:
                - RewritePath=/api/api-keys/(?<segment>.*), /api-keys/${segment}
                - RewritePath=/api/api-keys, /api-keys

# CORS tap trung tai Gateway. Luu y: Gateway dung variant WebMVC
# (spring-cloud-starter-gateway-server-webmvc) nen block globalcors cua WebFlux
# KHONG co tac dung - CORS duoc xu ly boi CorsFilter trong config/CorsConfig.java
app:
  cors:
    allowed-origins: http://localhost:5173

auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

jwt:
  secret: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

management:
  endpoints:
    web:
      exposure:
        include: gateway
